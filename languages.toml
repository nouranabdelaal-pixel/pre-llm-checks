# ---------------------------------------------------------------------------
# Go
# ---------------------------------------------------------------------------

[languages.go]
extensions    = [".go"]
project_files = ["go.mod"]
verification  = "untested"

[languages.go.stages.build]
builtin  = ["go build ./..."]
exact    = []
prefixes = []
excludes = []

[languages.go.stages.lint]
builtin         = []
config_triggers = [".golangci.yml", ".golangci.yaml", ".golangci.toml", ".golangci.json"]
exact    = []
prefixes = []
excludes = []

[languages.go.stages.tests]
builtin  = ["go test ./..."]
exact    = []
prefixes = []
excludes = []

[languages.go.stages.coverage]
builtin  = ["go test -coverprofile=coverage.out ./..."]
exact    = []
prefixes = []
excludes = []

[languages.go.dependency_check]
error_patterns = [
  "cannot find module",
  "no required module",
  "missing go.sum entry",
  "no matching versions",
]

[languages.go.coverage]
output_pattern = "total:\\s+\\(statements\\)\\s+(\\d+\\.?\\d*)%"

[[languages.go.coverage.report_files]]
path   = "coverage.out"
format = "go-cover"

# ---------------------------------------------------------------------------
# C# / .NET
# ---------------------------------------------------------------------------

[languages.dotnet]
extensions    = [".cs", ".fs", ".vb"]
project_files = ["*.sln", "*.csproj"]
verification  = "untested"

[languages.dotnet.stages.build]
builtin  = ["dotnet build"]
exact    = []
prefixes = []
excludes = []

[languages.dotnet.stages.lint]
builtin         = ["dotnet format --verify-no-changes"]
config_triggers = [".editorconfig"]
exact    = []
prefixes = []
excludes = []

[languages.dotnet.stages.tests]
builtin  = ["dotnet test"]
exact    = []
prefixes = []
excludes = []

[languages.dotnet.stages.coverage]
builtin  = ["dotnet test --collect:\"XPlat Code Coverage\""]
exact    = []
prefixes = []
excludes = []

[languages.dotnet.dependency_check]
error_patterns = [
  "Unable to find package",
  "error NU1",
  "Package restore failed",
  "MSBUILD : error",
]

[languages.dotnet.coverage]
output_pattern = "Line coverage:\\s+(\\d+\\.?\\d*)%"

[[languages.dotnet.coverage.report_files]]
path   = "TestResults/**/coverage.cobertura.xml"
format = "cobertura-xml"

