# languages.toml — language registry for pre-llm-checks
# Each language entry must have: extensions, project_files, verification
# Top-level ignore_extensions are never treated as source files.

ignore_extensions = [
  ".md", ".txt", ".rst", ".adoc",
  ".json", ".yaml", ".yml", ".toml", ".ini", ".cfg", ".conf",
  ".lock", ".sum",
  ".png", ".jpg", ".jpeg", ".gif", ".svg", ".ico", ".webp", ".bmp",
  ".pdf", ".zip", ".tar", ".gz", ".bz2", ".xz", ".whl", ".egg-info",
  ".class", ".pyc", ".pyo", ".pyd",
  ".exe", ".dll", ".so", ".dylib", ".a", ".lib",
  ".map", ".min.js", ".min.css",
  ".env", ".env.local", ".env.example",
  ".gitignore", ".gitattributes", ".editorconfig",
  ".DS_Store", "Thumbs.db",
]

# ---------------------------------------------------------------------------
# Python
# ---------------------------------------------------------------------------

[languages.python]
extensions    = [".py"]
project_files = ["pyproject.toml", "requirements.txt"]
verification  = "untested"

[languages.python.stages.lint]
exact    = ["lint"]
prefixes = ["lint:"]
excludes = [":fix", ":watch"]

[languages.python.stages.tests]
exact    = ["test", "tests"]
prefixes = ["test:"]
excludes = [":e2e", ":docker"]

[languages.python.dependency_check]
error_patterns = [
  "ModuleNotFoundError",
  "No module named",
  "ImportError",
  "cannot import name",
]

# ---------------------------------------------------------------------------
# JavaScript / TypeScript (Node)
# ---------------------------------------------------------------------------

[languages.node]
extensions    = [".js", ".ts", ".jsx", ".tsx", ".mjs", ".cjs"]
project_files = ["package.json"]
verification  = "untested"

[languages.node.stages.build]
exact    = ["build"]
prefixes = ["build:"]
excludes = [":watch", ":dev", ":docker", ":deploy"]

[languages.node.stages.lint]
exact    = ["lint"]
prefixes = ["lint:"]
excludes = [":fix", ":watch"]
config_triggers = [
  ".eslintrc", ".eslintrc.js", ".eslintrc.json", ".eslintrc.yml", ".eslintrc.yaml",
  "eslint.config.js", "eslint.config.mjs", "tsconfig.json",
]

[languages.node.stages.tests]
exact    = ["test"]
prefixes = ["test:"]
excludes = [":e2e", ":watch", ":docker"]

[languages.node.stages.coverage]
exact    = ["coverage"]
prefixes = ["coverage:"]
excludes = []

[languages.node.dependency_check]
filesystem     = "node_modules"
error_patterns = [
  "Cannot find module",
  "MODULE_NOT_FOUND",
  "command not found: jest",
  "command not found: vitest",
]

[languages.node.coverage]
output_pattern = "All files\\s*\\|[^|]*\\|[^|]*\\|[^|]*\\|\\s*(\\d+\\.?\\d*)"

[[languages.node.coverage.report_files]]
path   = "coverage/coverage-summary.json"
format = "istanbul-json-summary"

# ---------------------------------------------------------------------------
# Java — Maven
# ---------------------------------------------------------------------------

[languages.java_maven]
extensions    = [".java"]
project_files = ["pom.xml"]
verification  = "untested"

[languages.java_maven.stages.build]
builtin  = ["compile"]
exact    = []
prefixes = []
excludes = []

[languages.java_maven.stages.lint]
builtin         = ["checkstyle:check", "pmd:check", "spotbugs:check"]
config_triggers = ["checkstyle.xml", ".checkstyle.xml", "pmd.xml", "spotbugs.xml"]
exact    = []
prefixes = []
excludes = []

[languages.java_maven.stages.tests]
builtin  = ["test"]
exact    = []
prefixes = []
excludes = []

[languages.java_maven.stages.coverage]
builtin         = ["jacoco:report"]
config_triggers = []
exact    = []
prefixes = []
excludes = []

[languages.java_maven.dependency_check]
error_patterns = [
  "Could not resolve dependencies",
  "Artifact * not found",
  "Cannot access central",
  "Failed to read artifact",
]

[languages.java_maven.coverage]
output_pattern = "Total.*?(\\d+)%"

[[languages.java_maven.coverage.report_files]]
path   = "target/site/jacoco/jacoco.xml"
format = "jacoco-xml"

